name: Check POTEZ

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript
        run: node --check assets/app.js
      - name: Check Cloudflare Pages Function syntax
        run: node --input-type=module --check < functions/api/feedback.js
      - name: Check HTML parsing
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              pass
          for filename in ("index.html", "privacy.html"):
              parser = Check()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              parser.close()
              print(f"OK: {filename}")
          PY
